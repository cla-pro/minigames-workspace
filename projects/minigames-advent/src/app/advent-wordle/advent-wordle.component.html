<h1 class="game-title">Trouve le mot caché</h1>
<img class="back-img" src="assets/exit.png" (click)="goToBoard()" alt="Retour" />
<minigame-wordle [prefix]="scenario.prefix" [word]="word" (completionEvent)="scenarioCompleted()"></minigame-wordle>
<div>
  @if (scenario.completed) {
    <img class="scenario-completed" src="assets/green-check.png" />
  }
  @if (scenario.completed) {
    <div class="scenario-solution">
      <b>{{scenario.word}}</b>
    </div>
  }
</div>
