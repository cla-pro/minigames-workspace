<table class="scenario-board">
  @for (scenarioLine of numberedCells; track scenarioLine) {
    <tr>
      @for (scenarioCell of scenarioLine; track scenarioCell) {
        <td
          class="scenario-cell"
          [class.scenario-cell-background]="!getScenario(scenarioCell).completed">
          <advent-board-scenario [scenario]="getScenario(scenarioCell)" />
        </td>
      }
    </tr>
  }
</table>
<img class="background-image" [src]="backgroundurl" />
